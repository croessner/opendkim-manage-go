global:
  # opendkim|dkim2; omitting this value defaults to opendkim.
  # --mode provides an exact per-invocation override.
  mode: opendkim

  # Number of days that old keys stay protected before revoke/delete handling
  delete_delay: 10

  # Number of days after which new keys are generated by --add-new
  expire_after: 365

  # Selector format variables: ${randomhex:N}, ${year}, ${month}, ${day}
  selectorformat: "s${randomhex:8}.${year}-${month}"

  # Add DKIMIdentity=@domain to newly created LDAP selector objects
  use_dkim_identity: true

  # dark|light
  terminal_background: dark

  # both|rsa|ed25519
  keytype: both

  # Maximum number of revoked keys retained
  # Used only when revoked_retention is 0.
  max_revoked: 6

  # Days to retain direct-record DKIM tombstones (p=) after revocation.
  # Set to 0 only to select the legacy count-based max_revoked mode.
  revoked_retention: 30

  # CNAME mode selector prefixes
  cname_selector_rsa_prefix: "default-rsa-"
  cname_selector_ed25519_prefix: "default-ed25519-"

  # Domains that should use signing table wildcard domain '*'
  multiple_signatures_domains:
    - "example.org"

# Required when global.mode is dkim2 or --mode dkim2 is used. DKIM2 manages
# complete immutable generations, writes autonomous dkim2-datasource-v3
# campaigns, and does not convert legacy OpenDKIM selector objects.
dkim2:
  # Lowercase ASCII identifier: [a-z0-9][a-z0-9._-]*, at most 128 bytes.
  tenant_id: tenant-example

  # originator|ordinary_transit|delivery_status; the bound native signing
  # bridge does not project private keys for next_domain_transit.
  profile_use: originator

  # enforce|observe|off
  rollout: enforce

  # Only strict is supported.
  compatibility: strict

  # Optional lowercase ASCII identifier using the same bounded grammar.
  feedback_route_id: ""

  # Native DKIM2 automatic rotation is opt-in. Manual rotation, prepare,
  # resume, retirement, and forward rollback remain separately authorized.
  rotation_enabled: false

  # Exact retained-lineage age threshold for automatic rotation.
  rotate_after_days: 30

  # Bounded retained-generation scan. Reaching this limit fails closed.
  history_limit: 16384
  max_campaign_bindings: 16384

  # Every effective LDAP/model safety bound is explicit and overrideable.
  max_generation_entries: 131072
  max_attribute_bytes: 65536
  max_dataset_bytes: 1073741824
  max_ldap_requests: 262144
  max_ldap_bytes: 1073741824
  max_retained_root_visits: 32768
  identifier_allocation_attempts: 32
  publication_readback_attempts: 8
  publication_readback_interval_millis: 25
  ldap_search_time_limit_seconds: 30
  ldap_operation_timeout_seconds: 60
  authority_password_max_bytes: 16384

  # Required when rotation_enabled is true. Each role uses the common verified
  # LDAP transport below, but a distinct DN and owner-only password file.
  ldap_authorities:
    snapshot:
      bind_dn: "cn=dkim2-snapshot,o=company"
      password_file: "/run/secrets/dkim2-snapshot-password"
    staging:
      bind_dn: "cn=dkim2-staging,o=company"
      password_file: "/run/secrets/dkim2-staging-password"
    activation:
      bind_dn: "cn=dkim2-activation,o=company"
      password_file: "/run/secrets/dkim2-activation-password"
    purge:
      bind_dn: "cn=dkim2-purge,o=company"
      password_file: "/run/secrets/dkim2-purge-password"

  # Maximum accepted future skew for canonical LDAP operational timestamps.
  max_clock_skew_seconds: 300

  # One deadline bounds the complete native lifecycle run.
  run_timeout_seconds: 86400

  # Fresh authoritative and recursive proof polling bounds.
  proof_poll_interval_seconds: 5
  proof_max_attempts: 3600
  dns_query_timeout_seconds: 5

  # Minimum overlap after the exact cn=current activation timestamp before
  # explicitly attested DNS retirement can become eligible.
  retirement_min_overlap_seconds: 604800

  # Automatic history deletion retains current plus the configured rollback
  # reserve and deletes only complete, independently verified v3 generations.
  retention:
    enabled: true
    max_generations: 12
    min_rollback_generations: 2
    max_delete_batch: 64
    journal_file: "/var/lib/opendkim-manage-go/dkim2-retention-plan.json"
    max_journal_bytes: 4096

ldap:
  # LDAP URL format: ldap://host:port/base??scope?filter
  # In dkim2 mode, the URL base DN is the immutable dataset base. Install the
  # dkim2-datasource-v2 schema before use; request input never selects a base.
  uri: "ldap://localhost:389/ou=dkim,o=company??sub?(&(objectClass=domain)(associatedDomain={0}))"

  # LDAP attribute carrying the DKIM domain
  domain: associatedDomain

  # Optional indicator attribute for CNAME-managed domains
  destination_indicator: destinationIndicator

  # Optional service type attribute used for DNS s= field
  service_type: description

  # Optional TLS and bind settings
  use_starttls: true
  reqcert: demand
  # Explicit legacy exception only; false requires LDAPS or StartTLS and
  # certificate verification.
  allow_insecure: false
  ca: "/etc/opendkim-manage/cacert.pem"

  bindmethod: simple
  binddn: "cn=admin,o=company"
  bindpw: "CHANGE_ME"

# Optional for read-only legacy operations; required for DNS-writing commands.
dns:
  # Native DKIM2 lifecycle operations require two distinct canonical
  # host-or-IP:port endpoints. The primary endpoint is queried directly as
  # authoritative; the recursive endpoint is queried directly with recursion.
  primary_nameserver: "127.0.0.1:53"
  recursive_nameserver: "127.0.0.2:53"

  # TSIG is mandatory for --update-dns; name and file are a required pair.
  # A missing, unsigned, or non-success response makes the update fail.
  tsig_key_file: "/etc/opendkim-manage/Kexample.+165+50659.private"
  tsig_key_name: "example"
  algorithm: "hmac_sha512"

  ttl: 3600

  # Mandatory allowlist for every LDAP destinationIndicator encountered.
  # Multiple zones can be separated by commas, semicolons, or whitespace.
  cnames: "cnames.example.com"
